# /etc/nginx/sites-available/tiktok.hyprnode.de
# Zertifikat: sudo certbot --nginx -d tiktok.hyprnode.de

server {
    listen 80;
    listen [::]:80;
    server_name tiktok.hyprnode.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tiktok.hyprnode.de;

    ssl_certificate     /etc/letsencrypt/live/tiktok.hyprnode.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tiktok.hyprnode.de/privkey.pem;

    # Datensparsame Logs (keine vollständigen IP-Adressen)
    access_log off;

    client_max_body_size 1k;   # die Seite nimmt keine Uploads/Formulare entgegen

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
